run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - contextcheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - noctx
